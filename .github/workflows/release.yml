name: Release

# Builds static (musl) Linux binaries and a Windows binary for each target below.
# Pushing a `vX.Y.Z` tag publishes them as a GitHub release; running the
# workflow by hand only builds them and keeps the archives as workflow artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl       # amd64
          - aarch64-unknown-linux-musl      # arm64
          - armv7-unknown-linux-musleabihf  # armv7 (hard float)
          - arm-unknown-linux-musleabihf    # armv6 (Raspberry Pi Zero/1)
          - x86_64-pc-windows-gnu           # Windows x86_64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          name="qbittui-${version}-${TARGET}"
          mkdir -p "dist/$name"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/qbittui.exe" README.md LICENSE "dist/$name/"
            archive="$name.zip"
            (cd dist && zip -qr "$archive" "$name")
          else
            cp "target/$TARGET/release/qbittui" README.md LICENSE "dist/$name/"
            archive="$name.tar.gz"
            tar -C dist -czf "dist/$archive" "$name"
          fi
          (cd dist && sha256sum "$archive" > "$archive.sha256")

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz*
            dist/*.zip*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
