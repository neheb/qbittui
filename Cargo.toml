[package]
name = "qbittui"
version = "0.1.0"
edition = "2024"
description = "A terminal UI for qBittorrent"
license = "GPL-3.0-or-later"
repository = "https://github.com/neheb/qbittui"
readme = "README.md"
keywords = ["qbittorrent", "torrent", "tui", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "cookies", "multipart", "form", "query", "rustls-no-provider", "charset", "http2", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[profile.release]
lto = true
strip = true
